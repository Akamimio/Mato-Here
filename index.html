<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#243d62"><link rel="manifest" href="manifest.webmanifest"><title>Mato Here</title>
<style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#2c466d,#101b30);color:white;font-family:Arial,sans-serif;text-align:center}main{max-width:520px;margin:auto;padding:15px}h1{color:#ffd25b;letter-spacing:2px}.stats{display:flex;gap:7px}.stats>div{flex:1;border:1px solid #738baa;border-radius:10px;padding:12px 2px;font-size:13px}.stats b{display:block;font-size:20px;margin-top:5px}#field{position:relative;height:min(68vh,590px);min-height:390px;margin:12px 0;border:3px solid #8cadd0;border-radius:17px;overflow:hidden;background:linear-gradient(#4383a1,#163d55)}.crate{position:absolute;width:66px;height:66px;display:grid;place-items:center;font-size:48px;cursor:pointer;user-select:none;touch-action:manipulation;filter:drop-shadow(2px 5px 2px #15283a)}button{background:#ffd05c;border:0;border-radius:10px;padding:12px 22px;font-weight:bold;cursor:pointer}footer{display:flex;justify-content:space-between;align-items:center}#status{font-size:13px;color:#d9eaff}</style></head><body><main><h1>🎁 MATO HERE</h1><p>Smash crates. Collect gifts. Avoid bombs!</p><div class="stats"><div>Score<b id="score">0</b></div><div>Lives<b id="lives">❤️❤️❤️</b></div><div>Time<b id="time">60</b></div><div>Best<b id="best">0</b></div></div><div id="field"></div><footer><span id="status">Tap crates to smash them</span><button id="restart">Restart</button></footer></main>
<script>
(function(){
"use strict";
var field=document.getElementById("field"),scoreEl=document.getElementById("score"),timeEl=document.getElementById("time"),livesEl=document.getElementById("lives"),bestEl=document.getElementById("best"),statusEl=document.getElementById("status");
var score=0,lives=3,time=60,best=0,active=true,items=[],last=Date.now(),spawnWait=0;
try{best=Number(localStorage.getItem("mato-best-v5")||0)}catch(e){}
bestEl.textContent=best;
function spawn(){
 if(!active)return;
 var el=document.createElement("div");el.className="crate";el.textContent="📦";el.setAttribute("role","button");el.setAttribute("aria-label","Smash crate");
 var x=Math.random()*Math.max(1,field.clientWidth-72),y=-75,kind=Math.random();
 el.style.left=x+"px";el.style.top=y+"px";field.appendChild(el);
 var item={el:el,x:x,y:y,speed:75+Math.random()*75,kind:kind};items.push(item);
 el.addEventListener("pointerdown",function(ev){ev.preventDefault();if(!active)return;var i=items.indexOf(item);if(i<0)return;items.splice(i,1);el.remove();if(kind<.2){lives--;statusEl.textContent="💥 Bomb! One life lost."}else if(kind<.8){score+=10;statusEl.textContent="🎁 Gift found! +10 points"}else{score+=2;statusEl.textContent="Empty crate! +2 points"}if(score>best){best=score;try{localStorage.setItem("mato-best-v5",best)}catch(e){}}hud();if(lives<=0)finish("Game Over")});
}
function hud(){scoreEl.textContent=score;livesEl.textContent="❤️".repeat(Math.max(0,lives));timeEl.textContent=Math.ceil(time);bestEl.textContent=best}
function finish(message){active=false;statusEl.textContent=message+" — Score: "+score+". Press Restart!"}
function reset(){items.forEach(function(i){i.el.remove()});items=[];score=0;lives=3;time=60;active=true;last=Date.now();spawnWait=0;statusEl.textContent="Tap crates to smash them";hud();for(var i=0;i<5;i++){spawn();items[items.length-1].y=15+i*82;items[items.length-1].el.style.top=items[items.length-1].y+"px"}}
document.getElementById("restart").addEventListener("click",reset);
function tick(){var now=Date.now(),dt=Math.min((now-last)/1000,.15);last=now;if(active){time-=dt;spawnWait+=dt;if(spawnWait>.9){spawnWait=0;spawn()}if(items.length<3)spawn();items.slice().forEach(function(item){item.y+=item.speed*dt;item.el.style.top=item.y+"px";if(item.y>field.clientHeight+10){item.el.remove();items.splice(items.indexOf(item),1)}});if(time<=0){time=0;finish("Time Up")}hud()}requestAnimationFrame(tick)}
reset();requestAnimationFrame(tick);
})();
</script></body></html>
